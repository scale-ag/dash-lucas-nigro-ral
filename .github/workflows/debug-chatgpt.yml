name: Debug ChatGPT Ads (temporario)
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar utm_source e leads do ChatGPT Ads
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.parse, csv, io
          from collections import Counter

          def fetch(sid, sheet):
              url = f"https://docs.google.com/spreadsheets/d/{sid}/gviz/tq?tqx=out:csv&sheet={urllib.parse.quote(sheet)}"
              req = urllib.request.Request(url, headers={"User-Agent": "dash-debug-bot/1.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
              return list(csv.reader(io.StringIO(raw)))

          leads = fetch("1j3EQE4zbRlUVAKyDPTmlnTDP0Jlvw-enQyMPR2LXjfk", "Leads")
          h = leads[0]
          print("LEADS header:", h)
          ix = {k: h.index(k) for k in ["id","criado_em","utm_source","utm_medium","utm_campaign","utm_content","utm_term","classificacao"]}
          rows = [r for r in leads[1:] if any((c or "").strip() for c in r)]
          print(f"total leads: {len(rows)}")

          print("\n===== utm_source (contagem) =====")
          for k, n in Counter(r[ix["utm_source"]] for r in rows).most_common():
              print(f"  {k!r}: {n}")

          gpt = [r for r in rows if "chatgpt" in r[ix["utm_source"]].lower()]
          print(f"\n===== ChatGPT Ads: {len(gpt)} leads, {sum(1 for r in gpt if r[ix['classificacao']].strip().upper()=='QUALIFICADO')} MQLs =====")
          for key in ["utm_campaign","utm_medium","utm_content","utm_term","classificacao"]:
              print(f"\n  -- {key} --")
              for k, n in Counter(r[ix[key]] for r in gpt).most_common():
                  print(f"    {k!r}: {n}")
          print("\n  -- amostra (5 primeiras) --")
          for r in gpt[:5]:
              print("   ", {k: r[i] for k, i in ix.items()})

          meta = fetch("1xb5itNu9_No6keCKHyzG7qIPobT46BqfmJ_rP0v4h8c", "Página 1")
          mh = meta[0]
          print("\nMETA header:", mh)
          ic = mh.index("Campaign Name")
          print("META campanhas:", sorted({r[ic] for r in meta[1:] if len(r) > ic and r[ic].strip()}))
          EOF
