name: Debug Leads 02-09 (temporario)
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar leads do dia 02/09 (BRT)
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.parse, csv, io
          from datetime import datetime, timezone, timedelta

          BRT = timezone(timedelta(hours=-3))

          def fetch(sid, sheet):
              url = f"https://docs.google.com/spreadsheets/d/{sid}/gviz/tq?tqx=out:csv&sheet={urllib.parse.quote(sheet)}"
              req = urllib.request.Request(url, headers={"User-Agent": "dash-debug-bot/1.0"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
              return list(csv.reader(io.StringIO(raw)))

          def to_brt(v):
              s2 = v.replace("Z", "+00:00")
              dt = datetime.fromisoformat(s2)
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(BRT)

          leads = fetch("1j3EQE4zbRlUVAKyDPTmlnTDP0Jlvw-enQyMPR2LXjfk", "Leads")
          header = leads[0]
          i_id = header.index("id")
          i_created = header.index("criado_em")
          i_name = header.index("nome")
          i_phone = header.index("whatsapp")
          i_camp = header.index("utm_campaign")
          i_adset = header.index("utm_medium")
          i_ad = header.index("utm_content")
          i_qualif = header.index("classificacao")

          print("===== TODOS OS LEADS (ordenados), com data BRT completa =====")
          nonempty = [r for r in leads[1:] if any((c or "").strip() for c in r)]
          rows_sorted = sorted(nonempty, key=lambda r: r[i_created])
          count_02 = 0
          for row in rows_sorted:
              raw = row[i_created]
              try:
                  brt_dt = to_brt(raw)
                  brt_str = brt_dt.strftime("%Y-%m-%d %H:%M:%S")
                  brt_date = brt_dt.strftime("%Y-%m-%d")
              except Exception as e:
                  brt_str = f"ERRO:{e}"
                  brt_date = None
              flag = ""
              if brt_date == "2026-09-02":
                  count_02 += 1
                  flag = "  <<< 02/09 BRT >>>"
              print(f"id={row[i_id][:8]} criado_em(UTC)={raw!r:35} BRT={brt_str}{flag} nome={row[i_name]!r:25} phone={row[i_phone]!r:16} camp={row[i_camp][:20]!r} adset={row[i_adset][:15]!r} ad={row[i_ad]!r} qualif={row[i_qualif]!r}")
          print(f"\nTotal leads com data BRT = 2026-09-02: {count_02}")

          print("\n===== META: linhas do dia 2026-09-02 =====")
          meta = fetch("1xb5itNu9_No6keCKHyzG7qIPobT46BqfmJ_rP0v4h8c", "Página 1")
          mheader = meta[0]
          i_day = mheader.index("Day")
          for row in meta[1:]:
              if len(row) > i_day and row[i_day] == "2026-09-02":
                  print(" ", row)
          EOF
