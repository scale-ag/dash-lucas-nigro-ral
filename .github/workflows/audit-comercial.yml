name: Auditoria comercial (temporario)
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mapear abas comerciais (somente leitura, sem PII)
        run: |
          python3 - <<'PY'
          import sys
          from collections import Counter, defaultdict
          sys.path.insert(0, "build")
          import build as bp
          F = bp.SPREADSHEET_ID_FUNIL
          def load(name):
              rows = bp.fetch_csv(bp.sheet_url(F, name))
              h = rows[0]; body = [r for r in rows[1:] if any((c or "").strip() for c in r)]
              ix = {k: i for i, k in enumerate(h)}
              return h, body, (lambda r, k: bp.cell(r, ix.get(k)))
          Lh, L, lc = load("Leads")
          lead_ids = {lc(r, "id") for r in L}
          lead_ph = {bp.canon_phone(lc(r, "whatsapp")) for r in L} - {""}
          lead_em = {lc(r, "email").lower() for r in L} - {""}
          for tab in ["Comercial_Leads", "Comercial_Etapas", "Comercial_Presenca", "Investimento"]:
              try:
                  h, B, c = load(tab)
              except Exception as e:
                  print(tab, "ERRO", e); continue
              print(f"\n######## {tab}: {len(B)} linhas\nheader: {h}")
              if tab == "Comercial_Leads":
                  for k in ["funil_codigo", "funil_nome", "etapa_atual_codigo", "etapa_atual_nome", "origem", "atribuicao", "motivo_perda", "utm_source"]:
                      print(f"  {k}: {Counter(c(r, k) for r in B).most_common(40)}")
                  mk = [c(r, "marketing_lead_id") for r in B]
                  print("  marketing_lead_id preenchido:", sum(1 for x in mk if x), "| bate com Leads.id:", sum(1 for x in mk if x in lead_ids))
                  ph = [bp.canon_phone(c(r, "whatsapp")) for r in B]
                  print("  whatsapp bate com Leads:", sum(1 for p in ph if p in lead_ph), "| email bate:", sum(1 for r in B if c(r, "email").lower() in lead_em and c(r, "email")))
                  print("  leads do funil (Leads) achados no comercial por id/tel:", len({x for x in mk if x in lead_ids} | set()), "/", len(lead_ids),
                        "| por telefone:", len(lead_ph & set(ph)), "/", len(lead_ph))
                  print("  valor_proposta preenchido:", sum(1 for r in B if c(r, "valor_proposta")), "soma:", round(sum(bp.to_float(c(r, "valor_proposta")) for r in B), 2))
                  ds = sorted(d for d in (bp.parse_date_brt(c(r, "data_entrada")) for r in B) if d)
                  print("  data_entrada:", ds[:1], "->", ds[-1:])
                  # leads do funil: etapa atual
                  mfun = [r for r in B if c(r, "marketing_lead_id") in lead_ids or bp.canon_phone(c(r, "whatsapp")) in lead_ph]
                  print("  >> SÓ os que casam com a aba Leads:", len(mfun))
                  for k in ["funil_codigo", "etapa_atual_codigo", "etapa_atual_nome", "atribuicao", "origem", "motivo_perda"]:
                      print(f"     {k}: {Counter(c(r, k) for r in mfun).most_common(40)}")
                  print("     valor_proposta preenchido:", sum(1 for r in mfun if c(r, "valor_proposta")))
                  CL = (B, c)
              elif tab == "Comercial_Etapas":
                  st = Counter((c(r, "funil_codigo"), c(r, "etapa_codigo"), c(r, "etapa_nome")) for r in B)
                  for k, n in sorted(st.items()): print(f"  {n:4d}  {k}")
                  print("  fonte:", Counter(c(r, "fonte") for r in B), "| inferida:", Counter(c(r, "inferida") for r in B))
                  ds = sorted(d for d in (bp.parse_date_brt(c(r, "entrou_em")) for r in B) if d)
                  print("  entrou_em:", ds[:1], "->", ds[-1:])
                  cb, cc = CL
                  crm2mk = {}
                  for r in cb:
                      if cc(r, "marketing_lead_id") in lead_ids or bp.canon_phone(cc(r, "whatsapp")) in lead_ph:
                          crm2mk[cc(r, "lead_id")] = 1
                  ev = [r for r in B if c(r, "lead_id") in crm2mk]
                  print("  >> eventos de leads que casam com a aba Leads:", len(ev), "de", len(crm2mk), "leads")
                  st2 = Counter((c(r, "funil_codigo"), c(r, "etapa_codigo")) for r in ev)
                  for k, n in sorted(st2.items()): print(f"     {n:4d}  {k}")
                  byd = defaultdict(Counter)
                  for r in ev: byd[c(r, "etapa_codigo")][(bp.parse_date_brt(c(r, "entrou_em")) or "?")[:7]] += 1
                  for k, v in byd.items(): print("     mes", k, dict(v))
                  print("  ids de lead do comercial sem linha em Comercial_Leads:", len({c(r, "lead_id") for r in B} - {cc(r, "lead_id") for r in cb}))
              elif tab == "Comercial_Presenca":
                  print("  aba x ativo:", Counter((c(r, "aba"), c(r, "ativo")) for r in B))
              elif tab == "Investimento":
                  print("  plataforma:", Counter(c(r, "plataforma") for r in B), "| total:", round(sum(bp.to_float(c(r, "investimento")) for r in B), 2))
                  ds = sorted(d for d in (bp.parse_date(c(r, "data")) for r in B) if d); print("  datas:", ds[:1], "->", ds[-1:])
          h, B, c = load("Manychat")
          print(f"\n######## Manychat: {len(B)} linhas\nheader: {h}")
          for k in ["canal", "fluxo", "utm_source", "utm_campaign", "origem_tipo"]:
              print(f"  {k}: {Counter(c(r, k) for r in B).most_common(15)}")
          mph = {bp.canon_phone(c(r, "whatsapp")) for r in B} - {""}
          print("  com whatsapp:", len(mph), "| bate com Leads:", len(mph & lead_ph))
          ds = sorted(d for d in (bp.parse_date_brt(c(r, "criado_em")) for r in B) if d); print("  datas:", ds[:1], "->", ds[-1:])
          h, B, c = load("Qualificação")
          print(f"\n######## Qualificação: {len(B)} linhas\nheader: {h}")
          qph = {bp.canon_phone(c(r, "whatsapp")) for r in B} - {""}
          print("  classificacao:", Counter(c(r, "classificacao") for r in B), "| telefones que NÃO estão na Leads:", len(qph - lead_ph), "| Leads fora da Qualificação:", len(lead_ph - qph))
          lq = {bp.canon_phone(lc(r, "whatsapp")): lc(r, "classificacao") for r in L}
          print("  classificação diferente entre Leads e Qualificação:", sum(1 for r in B if bp.canon_phone(c(r, "whatsapp")) in lq and lq[bp.canon_phone(c(r, "whatsapp"))] != c(r, "classificacao")))
          h, B, c = load("Dashboard Comercial")
          print("\n######## Dashboard Comercial")
          for r in B: print("  ", [x for x in r if x.strip()])
          PY
