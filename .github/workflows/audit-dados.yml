name: Auditoria de dados (temporario)
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar Leads x Meta Ads x Vendas (somente leitura, sem PII)
        run: |
          python3 - <<'PY'
          import sys, re
          from collections import Counter, defaultdict
          sys.path.insert(0, "build")
          import build as bp

          def sq(s): return re.sub(r"\s+", " ", (s or "").strip()).lower()
          def sid(x): return (x or "")[:8]

          L = bp.fetch_csv(bp.sheet_url(bp.SPREADSHEET_ID_FUNIL, bp.SHEET_LEADS))
          V = bp.fetch_csv(bp.sheet_url(bp.SPREADSHEET_ID_FUNIL, bp.SHEET_VENDAS))
          M = bp.fetch_csv(bp.sheet_url(bp.SPREADSHEET_ID_META, bp.SHEET_META))

          lh = L[0]; li = {h: i for i, h in enumerate(lh)}
          vh = V[0]; vi = {h: i for i, h in enumerate(vh)}
          lrows = [r for r in L[1:] if any((c or "").strip() for c in r)]
          em = {}
          for r in lrows:
              e = bp.cell(r, li["email"]).lower()
              if e: em.setdefault(e, []).append(r)
          ids = {bp.cell(r, li["id"]) for r in lrows}
          for r in V[1:]:
              if not any((c or "").strip() for c in r): continue
              lid = bp.cell(r, vi["lead_id"]); e = bp.cell(r, vi["email"]).lower()
              hits = em.get(e, [])
              print(bp.parse_date_brt(bp.cell(r, vi["pago_em"])), "R$", bp.cell(r, vi["valor"]), "| produto:", bp.cell(r, vi["produto"])[:30],
                    "| casado_por:", repr(bp.cell(r, vi["casado_por"])), "| lead_id na Leads:", (lid in ids) if lid else "-",
                    "| email bate com lead:", len(hits), [ (bp.parse_date_brt(bp.cell(h, li["criado_em"])), bp.cell(h, li["utm_source"]), bp.cell(h, li["utm_campaign"])[:40], bp.cell(h, li["classificacao"])) for h in hits])
          for r in lrows:
              if bp.cell(r, li["utm_source"]) == "adryan gpt":
                  print("adryan gpt:", bp.parse_date_brt(bp.cell(r, li["criado_em"])), bp.cell(r, li["classificacao"]), bp.cell(r, li["utm_term"]))
          PY
